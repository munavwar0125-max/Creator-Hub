.pulse{
    display:inline-block;
    padding:10px 20px;
    background:#6c63ff;
    color:white;
    border-radius:25px;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.08);}
    100%{transform:scale(1);}
}
</head>

<body>

    <div class="pulse">Coming Soon</div>
