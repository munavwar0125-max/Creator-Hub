<!DOCTYPE html>
<html>
<head>
<style>

body{
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}

/* Combined Neon + Pulse */
.combined{
    padding:12px 28px;

    background:#1a1a1a;

    color:#00ffcc;

    border:2px solid #00ffcc;

    border-radius:30px;

    font-weight:bold;

    letter-spacing:1px;

    box-shadow:0 0 12px #00ffcc;

    animation:pulse 1s infinite;

    font-size:18px;
}

@keyframes pulse{
    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.5);
    }

    100%{
        transform:scale(1);
    }
}

</style>
</head>

<body>

<div class="combined">Coming Soon</div>

</body>
</html>{
